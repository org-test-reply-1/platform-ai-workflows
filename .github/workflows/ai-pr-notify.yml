name: Copilot PR Notification

on:
  workflow_call:
    secrets:
      TEAMS_WEBHOOK_URL:
        required: true

permissions:
  pull-requests: read
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Notifica Teams PR Copilot
        uses: org-test-reply-1/platform-actions/notify-teams@main
        with:
          webhook-url: ${{ secrets.TEAMS_WEBHOOK_URL }}
          title: '🤖 Pull Request aperta da Copilot — ${{ github.repository }}'
          message: '${{ github.event.pull_request.title }} | 👉 ${{ github.event.pull_request.html_url }}'
          color: 'orange'
