# platform-ai-workflows/.github/workflows/ai-security-scan.yml
name: AI Security Scan

on:
  workflow_call:
    inputs:
      scan-paths:
        description: 'Path da scansionare (default: tutto il repo)'
        required: false
        type: string
        default: '.'
      fail-on-critical:
        description: 'Fallire se trovate vulnerabilità critiche'
        required: false
        type: boolean
        default: false    # NON-BLOCCANTE di default
    secrets:
      COPILOT_GITHUB_TOKEN:
        required: false

permissions:
  contents: read
  id-token: write
  actions: read
  security-events: write

jobs:
  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Copilot CLI
        uses: org-test-reply-1/platform-actions/copilot-cli-setup@main
        with:
          copilot-token: ${{ secrets.COPILOT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Run Copilot Agent
        uses: org-test-reply-1/platform-actions/copilot-run-agent@main
        with:
          agent-file: .github/agents/security-reporter.agent.md
          task-prompt: |
            Scansiona tutti i file in ${{ inputs.scan-paths }}.
            Analizza l'intero codice della repository (inclusi workflow, script, Dockerfile, progetti .NET e test) e segnala criticità, vulnerabilità, debolezze di sicurezza e punti migliorabili.
            Fornisci suggerimenti pratici e priorità per la remediation.
          output-file: security-report.md
          copilot-token: ${{ secrets.COPILOT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Publish report
        if: always()
        run: cat security-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-security-report-${{ github.run_id }}
          path: security-report.md
          retention-days: 30

      - name: Check for critical vulnerabilities
        if: inputs.fail-on-critical
        run: |
          if [ ! -f "security-report.md" ]; then
            echo "⚠️ Report non generato"
            exit 0
          fi
          if grep -q "THIS ASSESSMENT CONTAINS A CRITICAL VULNERABILITY" security-report.md; then
            echo "❌ Vulnerabilità critica rilevata — build bloccata"
            exit 1
          else
            echo "✅ Nessuna vulnerabilità critica"
          fi
