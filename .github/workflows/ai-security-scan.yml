# platform-ai-workflows/.github/workflows/ai-security-scan.yml
name: AI Security Scan

on:
  workflow_call:
    inputs:
      scan-paths:
        description: 'Path da scansionare (default: tutto il repo)'
        required: false
        type: string
        default: '.'
      fail-on-critical:
        description: 'Fallire se trovate vulnerabilità critiche'
        required: false
        type: boolean
        default: false
    secrets:
      COPILOT_ASSIGN_PAT:
        required: true

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Run Copilot Agent (Issue + Coding Agent)
        uses: org-test-reply-1/platform-actions/copilot-run-agent@main
        with:
          scan-paths: ${{ inputs.scan-paths }}
          assign-pat: ${{ secrets.COPILOT_ASSIGN_PAT }}
          task-prompt: |
            ## 🔍 Analisi completa del codice sorgente

            Scansiona **tutto** il codice sorgente di questa repository in ${{ inputs.scan-paths }}.
            Analizza l'intero codice (inclusi workflow, script, Dockerfile, progetti .NET e test).

            ### Obiettivi:
            1. **Sicurezza**: vulnerabilità, secrets hardcoded, injection, misconfiguration
            2. **Qualità del codice**: code smells, duplicazioni, complessità eccessiva
            3. **Best practices**: pattern mancanti, configurazioni non ottimali
            4. **Pipeline**: problemi nei workflow, permessi eccessivi, mancanza di validazioni

            ### Output richiesto:
            - Report con severity (CRITICAL, HIGH, MEDIUM, LOW)
            - Per ogni problema: descrizione, file, linea, fix suggerito
            - **Apri una Pull Request** con i fix per problemi CRITICAL e HIGH
            - Se trovi vulnerabilità critiche, aggiungi nel commento: "THIS ASSESSMENT CONTAINS A CRITICAL VULNERABILITY"
