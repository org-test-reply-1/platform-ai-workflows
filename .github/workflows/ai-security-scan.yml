# platform-ai-workflows/.github/workflows/ai-security-scan.yml
name: AI Security Scan

on:
  workflow_call:
    inputs:
      scan-paths:
        description: 'Paths to scan (default: entire repository)'
        required: false
        type: string
        default: '.'
      fail-on-critical:
        description: 'Fail if critical vulnerabilities are found'
        required: false
        type: boolean
        default: false
    secrets:
      COPILOT_ASSIGN_PAT:
        required: true

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Run Copilot Agent (Issue + Coding Agent)
        uses: org-test-reply-1/platform-actions/copilot-run-agent@main
        with:
          scan-paths: ${{ inputs.scan-paths }}
          assign-pat: ${{ secrets.COPILOT_ASSIGN_PAT }}
          task-prompt: |
            ## Full source code analysis

            Scan **all** source code in this repository at ${{ inputs.scan-paths }}.
            Analyze all code (including workflows, scripts, Dockerfiles, .NET projects, and tests).

            ### Objectives:
            1. **Security**: vulnerabilities, hardcoded secrets, injection, misconfiguration
            2. **Code quality**: code smells, duplication, excessive complexity
            3. **Best practices**: missing patterns, suboptimal configurations
            4. **Pipeline**: workflow issues, excessive permissions, missing validations

            ### Expected output:
            - Report with severity levels (CRITICAL, HIGH, MEDIUM, LOW)
            - For each issue: description, file, line number, suggested fix
            - **Open a Pull Request** with fixes for CRITICAL and HIGH issues
            - If critical vulnerabilities are found, add in the comment: "THIS ASSESSMENT CONTAINS A CRITICAL VULNERABILITY"
