name: Org-wide Failure Handler

on:
  workflow_call:
    inputs:
      lookback-minutes:
        description: 'Minuti indietro da controllare (default: 120)'
        required: false
        type: number
        default: 120
      dry-run:
        description: 'Solo report, senza creare issue'
        required: false
        type: boolean
        default: false
      target-repo:
        description: 'Repository da scansionare. Se vuoto scansiona tutta la org.'
        required: false
        type: string
        default: ''
      failed-run-id:
        description: 'Run ID del fallimento specifico. Se vuoto scansiona tutta la org.'
        required: false
        type: string
        default: ''
    secrets:
      COPILOT_ASSIGN_PAT:
        required: true
      TEAMS_WEBHOOK_URL:
        required: true

permissions:
  contents: read
  actions: read

jobs:
  scan-org-failures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan failed runs
        env:
          GH_TOKEN: ${{ secrets.COPILOT_ASSIGN_PAT }}
        run: |
          ORG="${{ github.repository_owner }}"
          LOOKBACK="${{ inputs.lookback-minutes || 120 }}"
          SINCE=$(date -u -d "${LOOKBACK} minutes ago" '+%Y-%m-%dT%H:%M:%SZ' 2>/dev/null || \
                  date -u -v-${LOOKBACK}M '+%Y-%m-%dT%H:%M:%SZ')

          TARGET_REPO="${{ inputs.target-repo }}"
          FAILED_RUN_ID="${{ inputs.failed-run-id }}"

          echo "GH_TOKEN is set? $([ -n "$GH_TOKEN" ] && echo yes || echo no)"

          # Modalità run ID specifico
          if [ -n "$FAILED_RUN_ID" ] && [ -n "$TARGET_REPO" ]; then
            echo "🎯 Modalità run specifico: ${FAILED_RUN_ID} in ${TARGET_REPO}"
            FULL_REPO="${ORG}/$(echo "$TARGET_REPO" | sed 's|.*/||')"

            RUN_DATA=$(gh api "/repos/${FULL_REPO}/actions/runs/${FAILED_RUN_ID}" \
              --jq '{id: .id, name: .name, branch: .head_branch, sha: .head_sha, url: .html_url, created: .created_at, repo: "'"${FULL_REPO}"'"}' \
              2>/dev/null)

            if [ -n "$RUN_DATA" ]; then
              echo "$RUN_DATA" | jq -c '.' >> new-failures.jsonl
              TOTAL=$(wc -l < new-failures.jsonl)
              echo "📊 Run da processare: ${TOTAL}"
            else
              echo "✅ Run non trovato o già gestito"
              echo "no_failures=true" >> "$GITHUB_ENV"
            fi

            echo "mode=repo" >> "$GITHUB_ENV"

          # Modalità repo singola
          elif [ -n "$TARGET_REPO" ]; then
            echo "🔍 Scansione repository: ${TARGET_REPO}"
            echo "📅 Run falliti dal: ${SINCE}"
            REPOS=$(echo "$TARGET_REPO" | sed 's|.*/||')
            echo "mode=repo" >> "$GITHUB_ENV"

            for REPO in $REPOS; do
              FULL_REPO="${ORG}/${REPO}"

              FAILED_RUNS=$(gh api "/repos/${FULL_REPO}/actions/runs?status=failure&created=>=${SINCE}&per_page=10" \
                --jq '.workflow_runs[] | {id: .id, name: .name, branch: .head_branch, sha: .head_sha, url: .html_url, created: .created_at, repo: "'"${FULL_REPO}"'"}' \
                2>/dev/null) || continue

              if [ -z "$FAILED_RUNS" ]; then
                continue
              fi

              echo "$FAILED_RUNS" | while IFS= read -r run_json; do
                RUN_ID=$(echo "$run_json" | jq -r '.id')
                EXISTING=$(gh issue list --repo "$FULL_REPO" --label "copilot-auto" \
                  --search "run #${RUN_ID}" --json number --jq 'length' 2>/dev/null || echo "0")
                if [ "$EXISTING" = "0" ]; then
                  echo "$run_json" | jq -c '.' >> new-failures.jsonl
                else
                  echo "  ⏭️  Skip ${FULL_REPO} run #${RUN_ID} — issue già esistente"
                fi
              done
            done

            if [ -f "new-failures.jsonl" ] && [ -s "new-failures.jsonl" ]; then
              TOTAL=$(wc -l < new-failures.jsonl)
              echo "📊 Run falliti da processare: ${TOTAL}"
            else
              echo "✅ Nessun run fallito non gestito trovato"
              echo "no_failures=true" >> "$GITHUB_ENV"
            fi

          # Modalità org
          else
            echo "🔍 Scansione org: ${ORG}"
            echo "📅 Run falliti dal: ${SINCE}"
            REPOS=$(gh repo list "$ORG" --limit 200 --json name --jq '.[].name')
            echo "mode=org" >> "$GITHUB_ENV"

            echo '[]' > all-failures.json

            for REPO in $REPOS; do
              FULL_REPO="${ORG}/${REPO}"

              FAILED_RUNS=$(gh api "/repos/${FULL_REPO}/actions/runs?status=failure&created=>=${SINCE}&per_page=10" \
                --jq '.workflow_runs[] | {id: .id, name: .name, branch: .head_branch, sha: .head_sha, url: .html_url, created: .created_at, repo: "'"${FULL_REPO}"'"}' \
                2>/dev/null) || continue

              if [ -z "$FAILED_RUNS" ]; then
                continue
              fi

              echo "$FAILED_RUNS" | while IFS= read -r run_json; do
                RUN_ID=$(echo "$run_json" | jq -r '.id')
                EXISTING=$(gh issue list --repo "$FULL_REPO" --label "copilot-auto" \
                  --search "run #${RUN_ID}" --json number --jq 'length' 2>/dev/null || echo "0")
                if [ "$EXISTING" = "0" ]; then
                  echo "$run_json" | jq -c '.' >> new-failures.jsonl
                else
                  echo "  ⏭️  Skip ${FULL_REPO} run #${RUN_ID} — issue già esistente"
                fi
              done
            done

            if [ -f "new-failures.jsonl" ] && [ -s "new-failures.jsonl" ]; then
              TOTAL=$(wc -l < new-failures.jsonl)
              echo "📊 Run falliti da processare: ${TOTAL}"
            else
              echo "✅ Nessun run fallito non gestito trovato"
              echo "no_failures=true" >> "$GITHUB_ENV"
            fi
          fi

      - name: Create issues and assign Copilot
        if: env.no_failures != 'true' && env.mode == 'repo' && inputs.dry-run != true
        env:
          GH_TOKEN: ${{ secrets.COPILOT_ASSIGN_PAT }}
        run: |
          if [ ! -f "new-failures.jsonl" ] || [ ! -s "new-failures.jsonl" ]; then
            echo "Nessun failure da processare"
            exit 0
          fi

          CREATED=0
          ERRORS=0

          while IFS= read -r failure; do
            RUN_ID=$(echo "$failure" | jq -r '.id')
            RUN_NAME=$(echo "$failure" | jq -r '.name')
            RUN_URL=$(echo "$failure" | jq -r '.url')
            RUN_BRANCH=$(echo "$failure" | jq -r '.branch')
            RUN_SHA=$(echo "$failure" | jq -r '.sha')
            RUN_REPO=$(echo "$failure" | jq -r '.repo')

            echo "📝 Creazione issue per ${RUN_REPO} — ${RUN_NAME} (run #${RUN_ID})"

            LOG_EXCERPT=$(gh run view "$RUN_ID" --repo "$RUN_REPO" --log-failed 2>/dev/null | tail -80 || echo "Log non disponibili")

            FAILED_JOBS=$(gh run view "$RUN_ID" --repo "$RUN_REPO" --json jobs \
              --jq '.jobs[] | select(.conclusion == "failure") | "- **\(.name)**: \(.steps[] | select(.conclusion == "failure") | .name)"' \
              2>/dev/null || echo "Info job non disponibili")

            DETECTED=$(date -u '+%Y-%m-%d %H:%M UTC')
            ISSUE_BODY=$(printf '## Workflow fallito — rilevato automaticamente\n\n**Workflow**: %s\n**Run**: [#%s](%s)\n**Repository**: `%s`\n**Branch**: `%s`\n**Commit**: `%s`\n**Data rilevamento**: %s\n\n### Job e step falliti\n%s\n\n### Log di errore (ultimi 80 righe)\n```\n%s\n```\n\n### Istruzioni\nAnalizza il log di errore, identifica la causa root e proponi un fix.\n- Se e un errore di build (Maven, npm), controlla dipendenze e configurazione\n- Se e un errore di test, verifica il test e il codice sotto test\n- Se e un errore di deploy, verifica configurazione k8s e secrets\n- Se il problema e nel template centralizzato (platform-workflows), segnalalo senza modificare il template\n- Rispetta le convenzioni in `.github/copilot-instructions.md`\n' \
                "$RUN_NAME" "$RUN_ID" "$RUN_URL" "$RUN_REPO" "$RUN_BRANCH" "$RUN_SHA" "$DETECTED" "$FAILED_JOBS" "$LOG_EXCERPT")

            gh label create "copilot-auto" --repo "$RUN_REPO" --color "0075ca" --description "Auto-managed by AI" 2>/dev/null || true
            gh label create "bug" --repo "$RUN_REPO" --color "d73a4a" --description "Something isn't working" 2>/dev/null || true

            ISSUE_URL=$(gh issue create \
              --repo "$RUN_REPO" \
              --title "Auto-fix: ${RUN_NAME} fallito (run #${RUN_ID})" \
              --body "$ISSUE_BODY" \
              --label "copilot-auto" \
              --label "bug" 2>&1) && {
                CREATED=$((CREATED + 1))
                echo "  ✅ Issue creata: ${ISSUE_URL}"
                echo "${ISSUE_URL}" >> created-issues.txt
              } || {
                ERRORS=$((ERRORS + 1))
                echo "  ⚠️ Errore creazione issue: ${ISSUE_URL}"
              }

          done < new-failures.jsonl

          echo "📊 Riepilogo: ${CREATED} issue create, ${ERRORS} errori"
          echo "created=${CREATED}" >> "$GITHUB_ENV"
          echo "errors=${ERRORS}" >> "$GITHUB_ENV"

      - name: Triggera Copilot sulle issue create
        if: env.no_failures != 'true' && env.mode == 'repo' && inputs.dry-run != true
        env:
          GH_TOKEN: ${{ secrets.COPILOT_ASSIGN_PAT }}
        run: |
          if [ ! -f "created-issues.txt" ]; then
            echo "Nessuna issue da processare"
            exit 0
          fi

          while IFS= read -r issue_url; do
            echo "🤖 Assegnando Copilot alla issue: ${issue_url}"

            ISSUE_NUM=$(echo "$issue_url" | grep -oE '[0-9]+$')
            REPO_FULL=$(echo "$issue_url" | sed -n 's|.*github\.com/\([^/]*/[^/]*\)/.*|\1|p')
            OWNER=$(echo "$REPO_FULL" | cut -d'/' -f1)
            REPO_NAME=$(echo "$REPO_FULL" | cut -d'/' -f2)

            ISSUE_NODE_ID=$(gh api graphql -f query='
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  issue(number: $number) { id }
                }
              }' -f owner="$OWNER" -f repo="$REPO_NAME" -F number="$ISSUE_NUM" \
              --jq '.data.repository.issue.id')

            if [ -z "$ISSUE_NODE_ID" ]; then
              echo "  ⚠️ Impossibile ottenere node ID per issue #${ISSUE_NUM}"
              continue
            fi

            COPILOT_ID=$(gh api graphql \
              -H "GraphQL-Features: issues_copilot_assignment_api_support,coding_agent_model_selection" \
              -f query='
              query($owner: String!, $repo: String!) {
                repository(owner: $owner, name: $repo) {
                  suggestedActors(first: 10, capabilities: [CAN_BE_ASSIGNED]) {
                    nodes {
                      login
                      ... on Bot { id }
                      ... on User { id }
                      ... on Mannequin { id }
                    }
                  }
                }
              }' -f owner="$OWNER" -f repo="$REPO_NAME" \
              --jq '.data.repository.suggestedActors.nodes[] | select(.login == "copilot-swe-agent") | .id')

            if [ -z "$COPILOT_ID" ]; then
              echo "  ⚠️ Copilot agent non disponibile in ${REPO_FULL}"
              continue
            fi

            echo "  📎 Copilot ID: ${COPILOT_ID}"

            gh api graphql \
              -H "GraphQL-Features: issues_copilot_assignment_api_support,coding_agent_model_selection" \
              -f query="mutation { addAssigneesToAssignable(input: { assignableId: \"$ISSUE_NODE_ID\", assigneeIds: [\"$COPILOT_ID\"] }) { clientMutationId } }" \
              && echo "  ✅ Copilot assegnato" \
              || echo "  ⚠️ Errore assegnazione Copilot"

          done < created-issues.txt

      - name: Prepara messaggio Teams
        if: always()
        run: |
          ORG="${{ github.repository_owner }}"
          if [ "${{ env.no_failures }}" = "true" ]; then
            if [ "${{ env.mode }}" = "repo" ]; then
              echo "TEAMS_TITLE=✅ Repository OK" >> "$GITHUB_ENV"
              echo "TEAMS_MESSAGE=Nessun workflow fallito in ${{ inputs.target-repo }}." >> "$GITHUB_ENV"
            else
              echo "TEAMS_TITLE=✅ Org OK" >> "$GITHUB_ENV"
              echo "TEAMS_MESSAGE=Nessun workflow fallito nelle ultime 2 ore." >> "$GITHUB_ENV"
            fi
            echo "TEAMS_COLOR=green" >> "$GITHUB_ENV"
          else
            if [ -f "new-failures.jsonl" ] && [ -s "new-failures.jsonl" ]; then
              FAILURE_COUNT=$(wc -l < new-failures.jsonl | tr -d ' ')
            else
              FAILURE_COUNT=1
            fi

            FAILURE_LIST=""
            if [ -f "new-failures.jsonl" ] && [ -s "new-failures.jsonl" ]; then
              while IFS= read -r f; do
                REPO=$(echo "$f" | jq -r '.repo' | sed "s|${ORG}/||")
                NAME=$(echo "$f" | jq -r '.name')
                ID=$(echo "$f" | jq -r '.id')
                URL=$(echo "$f" | jq -r '.url')
                FAILURE_LIST="${FAILURE_LIST}• ${REPO} — ${NAME} ([run #${ID}](${URL}))  \n"
              done < new-failures.jsonl
            fi

            if [ "${{ env.mode }}" = "repo" ]; then
              TITLE="❌ Workflow fallito — ${{ inputs.target-repo }}"
              MSG="Workflow fallito rilevato in ${{ inputs.target-repo }}."
              ISSUE_LINK="https://github.com/${{ inputs.target-repo }}/issues"
              {
                echo "TEAMS_MESSAGE<<EOF"
                echo "${MSG}"
                echo ""
                printf '%b' "${FAILURE_LIST}"
                echo ""
                echo "👉 Controlla le issue: ${ISSUE_LINK}"
                echo "EOF"
              } >> "$GITHUB_ENV"
            else
              TITLE="❌ Workflow falliti rilevati — ${ORG}"
              MSG="Trovati ${FAILURE_COUNT} fallimenti nelle ultime 2 ore:"

              ISSUE_LINKS=""
              if [ -f "new-failures.jsonl" ] && [ -s "new-failures.jsonl" ]; then
                while IFS= read -r f; do
                  REPO=$(echo "$f" | jq -r '.repo')
                  ISSUE_LINKS="${ISSUE_LINKS}• https://github.com/${REPO}/issues\n"
                done < <(jq -s 'unique_by(.repo)[]' new-failures.jsonl)
              fi

              {
                echo "TEAMS_MESSAGE<<EOF"
                echo "${MSG}"
                echo ""
                printf '%b' "${FAILURE_LIST}"
                echo ""
                echo "👉 Controlla le issue per repo:"
                printf '%b' "${ISSUE_LINKS}"
                echo "EOF"
              } >> "$GITHUB_ENV"
            fi

            echo "TEAMS_TITLE=${TITLE}" >> "$GITHUB_ENV"
            echo "TEAMS_COLOR=red" >> "$GITHUB_ENV"
          fi

      - name: Notifica Teams
        if: always()
        uses: org-test-reply-1/platform-actions/notify-teams@main
        with:
          webhook-url: ${{ secrets.TEAMS_WEBHOOK_URL }}
          title: ${{ env.TEAMS_TITLE }}
          message: ${{ env.TEAMS_MESSAGE }}
          color: ${{ env.TEAMS_COLOR }}
