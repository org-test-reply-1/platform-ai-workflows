name: Org-wide Failure Handler

on:
  #schedule:
    #- cron: '0 */2 * * *'
  workflow_dispatch:
  workflow_call:
    inputs:
      lookback-minutes:
        description: 'Minutes to look back for failed runs (default: 120)'
        required: false
        type: number
        default: 120
      dry-run:
        description: 'Report only, do not create issues'
        required: false
        type: boolean
        default: false
      target-repo:
        description: 'Repository to scan. If empty, scans the entire org.'
        required: false
        type: string
        default: ''
      failed-run-id:
        description: 'Run ID of the specific failure. If empty, scans the entire org.'
        required: false
        type: string
        default: ''
    secrets:
      COPILOT_ASSIGN_PAT:
        required: true
      TEAMS_WEBHOOK_URL:
        required: true

permissions:
  contents: read
  actions: read

jobs:
  scan-org-failures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan failed runs
        env:
          GH_TOKEN: ${{ secrets.COPILOT_ASSIGN_PAT }}
        run: |
          ORG="${{ github.repository_owner }}"
          LOOKBACK="${{ inputs.lookback-minutes || 120 }}"
          SINCE=$(date -u -d "${LOOKBACK} minutes ago" '+%Y-%m-%dT%H:%M:%SZ' 2>/dev/null || \
                  date -u -v-${LOOKBACK}M '+%Y-%m-%dT%H:%M:%SZ')

          TARGET_REPO="${{ inputs.target-repo }}"
          FAILED_RUN_ID="${{ inputs.failed-run-id }}"

          echo "GH_TOKEN is set? $([ -n "$GH_TOKEN" ] && echo yes || echo no)"

          # Specific run mode
          if [ -n "$FAILED_RUN_ID" ] && [ -n "$TARGET_REPO" ]; then
            echo "Specific run mode: ${FAILED_RUN_ID} in ${TARGET_REPO}"
            FULL_REPO="${ORG}/$(echo "$TARGET_REPO" | sed 's|.*/||')"

            RUN_DATA=$(gh api "/repos/${FULL_REPO}/actions/runs/${FAILED_RUN_ID}" \
              --jq '{id: .id, name: .name, branch: .head_branch, sha: .head_sha, url: .html_url, created: .created_at, repo: "'"${FULL_REPO}"'"}' \
              2>/dev/null)

            if [ -n "$RUN_DATA" ]; then
              echo "$RUN_DATA" | jq -c '.' >> new-failures.jsonl
              TOTAL=$(wc -l < new-failures.jsonl)
              echo "Runs to process: ${TOTAL}"
            else
              echo "Run not found or already handled"
              echo "no_failures=true" >> "$GITHUB_ENV"
            fi

            echo "mode=repo" >> "$GITHUB_ENV"

          # Single repository mode
          elif [ -n "$TARGET_REPO" ]; then
            echo "Scanning repository: ${TARGET_REPO}"
            echo "Failed runs since: ${SINCE}"
            REPOS=$(echo "$TARGET_REPO" | sed 's|.*/||')
            echo "mode=repo" >> "$GITHUB_ENV"

            for REPO in $REPOS; do
              FULL_REPO="${ORG}/${REPO}"

              FAILED_RUNS=$(gh api "/repos/${FULL_REPO}/actions/runs?status=failure&created=>=${SINCE}&per_page=10" \
                --jq '.workflow_runs[] | {id: .id, name: .name, branch: .head_branch, sha: .head_sha, url: .html_url, created: .created_at, repo: "'"${FULL_REPO}"'"}' \
                2>/dev/null) || continue

              if [ -z "$FAILED_RUNS" ]; then
                continue
              fi

              echo "$FAILED_RUNS" | while IFS= read -r run_json; do
                RUN_ID=$(echo "$run_json" | jq -r '.id')
                EXISTING=$(gh issue list --repo "$FULL_REPO" --label "copilot-auto" \
                  --search "run #${RUN_ID}" --json number --jq 'length' 2>/dev/null || echo "0")
                if [ "$EXISTING" = "0" ]; then
                  echo "$run_json" | jq -c '.' >> new-failures.jsonl
                else
                  echo "  Skip ${FULL_REPO} run #${RUN_ID} - issue already exists"
                fi
              done
            done

            if [ -f "new-failures.jsonl" ] && [ -s "new-failures.jsonl" ]; then
              TOTAL=$(wc -l < new-failures.jsonl)
              echo "Failed runs to process: ${TOTAL}"
            else
              echo "No unhandled failed runs found"
              echo "no_failures=true" >> "$GITHUB_ENV"
            fi

          # Org-wide mode
          else
            echo "Scanning org: ${ORG}"
            echo "Failed runs since: ${SINCE}"
            REPOS=$(gh repo list "$ORG" --limit 200 --json name --jq '.[].name')
            echo "mode=org" >> "$GITHUB_ENV"

            echo '[]' > all-failures.json

            for REPO in $REPOS; do
              FULL_REPO="${ORG}/${REPO}"

              FAILED_RUNS=$(gh api "/repos/${FULL_REPO}/actions/runs?status=failure&created=>=${SINCE}&per_page=10" \
                --jq '.workflow_runs[] | {id: .id, name: .name, branch: .head_branch, sha: .head_sha, url: .html_url, created: .created_at, repo: "'"${FULL_REPO}"'"}' \
                2>/dev/null) || continue

              if [ -z "$FAILED_RUNS" ]; then
                continue
              fi

              echo "$FAILED_RUNS" | while IFS= read -r run_json; do
                RUN_ID=$(echo "$run_json" | jq -r '.id')
                EXISTING=$(gh issue list --repo "$FULL_REPO" --label "copilot-auto" \
                  --search "run #${RUN_ID}" --json number --jq 'length' 2>/dev/null || echo "0")
                if [ "$EXISTING" = "0" ]; then
                  echo "$run_json" | jq -c '.' >> new-failures.jsonl
                else
                  echo "  Skip ${FULL_REPO} run #${RUN_ID} - issue already exists"
                fi
              done
            done

            if [ -f "new-failures.jsonl" ] && [ -s "new-failures.jsonl" ]; then
              TOTAL=$(wc -l < new-failures.jsonl)
              echo "Failed runs to process: ${TOTAL}"
            else
              echo "No unhandled failed runs found"
              echo "no_failures=true" >> "$GITHUB_ENV"
            fi
          fi

      - name: Create issues and assign Copilot
        if: env.no_failures != 'true' && env.mode == 'repo' && inputs.dry-run != true
        env:
          GH_TOKEN: ${{ secrets.COPILOT_ASSIGN_PAT }}
        run: |
          if [ ! -f "new-failures.jsonl" ] || [ ! -s "new-failures.jsonl" ]; then
            echo "No failures to process"
            exit 0
          fi

          CREATED=0
          ERRORS=0

          while IFS= read -r failure; do
            RUN_ID=$(echo "$failure" | jq -r '.id')
            RUN_NAME=$(echo "$failure" | jq -r '.name')
            RUN_URL=$(echo "$failure" | jq -r '.url')
            RUN_BRANCH=$(echo "$failure" | jq -r '.branch')
            RUN_SHA=$(echo "$failure" | jq -r '.sha')
            RUN_REPO=$(echo "$failure" | jq -r '.repo')

            echo "Creating issue for ${RUN_REPO} - ${RUN_NAME} (run #${RUN_ID})"

            LOG_EXCERPT=$(gh run view "$RUN_ID" --repo "$RUN_REPO" --log-failed 2>/dev/null | tail -80 || echo "Logs not available")

            FAILED_JOBS=$(gh run view "$RUN_ID" --repo "$RUN_REPO" --json jobs \
              --jq '.jobs[] | select(.conclusion == "failure") | "- **\(.name)**: \(.steps[] | select(.conclusion == "failure") | .name)"' \
              2>/dev/null || echo "Job info not available")

            DETECTED=$(date -u '+%Y-%m-%d %H:%M UTC')
            ISSUE_BODY=$(printf '## Failed workflow - automatically detected\n\n**Workflow**: %s\n**Run**: [#%s](%s)\n**Repository**: `%s`\n**Branch**: `%s`\n**Commit**: `%s`\n**Detected at**: %s\n\n### Failed jobs and steps\n%s\n\n### Error log (last 80 lines)\n```\n%s\n```\n\n### Instructions\nAnalyze the error log, identify the root cause, and propose a fix.\n- If it is a build error (Maven, npm), check dependencies and configuration\n- If it is a test error, verify the test and the code under test\n- If it is a deploy error, verify k8s configuration and secrets\n- If the issue is in the centralized template (platform-workflows), report it without modifying the template\n- Follow the conventions in `.github/copilot-instructions.md`\n' \
                "$RUN_NAME" "$RUN_ID" "$RUN_URL" "$RUN_REPO" "$RUN_BRANCH" "$RUN_SHA" "$DETECTED" "$FAILED_JOBS" "$LOG_EXCERPT")

            gh label create "copilot-auto" --repo "$RUN_REPO" --color "0075ca" --description "Auto-managed by CI" 2>/dev/null || true
            gh label create "bug" --repo "$RUN_REPO" --color "d73a4a" --description "Something isn't working" 2>/dev/null || true

            ISSUE_URL=$(gh issue create \
              --repo "$RUN_REPO" \
              --title "Auto-fix: ${RUN_NAME} failed (run #${RUN_ID})" \
              --body "$ISSUE_BODY" \
              --label "copilot-auto" \
              --label "bug" 2>&1) && {
                CREATED=$((CREATED + 1))
                echo "  Issue created: ${ISSUE_URL}"
                echo "${ISSUE_URL}" >> created-issues.txt
              } || {
                ERRORS=$((ERRORS + 1))
                echo "  Error creating issue: ${ISSUE_URL}"
              }

          done < new-failures.jsonl

          echo "Summary: ${CREATED} issues created, ${ERRORS} errors"
          echo "created=${CREATED}" >> "$GITHUB_ENV"
          echo "errors=${ERRORS}" >> "$GITHUB_ENV"

      - name: Trigger Copilot on created issues
        if: env.no_failures != 'true' && env.mode == 'repo' && inputs.dry-run != true
        env:
          GH_TOKEN: ${{ secrets.COPILOT_ASSIGN_PAT }}
        run: |
          if [ ! -f "created-issues.txt" ]; then
            echo "No issues to process"
            exit 0
          fi

          while IFS= read -r issue_url; do
            echo "Assigning Copilot to issue: ${issue_url}"

            ISSUE_NUM=$(echo "$issue_url" | grep -oE '[0-9]+$')
            REPO_FULL=$(echo "$issue_url" | sed -n 's|.*github\.com/\([^/]*/[^/]*\)/.*|\1|p')
            OWNER=$(echo "$REPO_FULL" | cut -d'/' -f1)
            REPO_NAME=$(echo "$REPO_FULL" | cut -d'/' -f2)

            ISSUE_NODE_ID=$(gh api graphql -f query='
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  issue(number: $number) { id }
                }
              }' -f owner="$OWNER" -f repo="$REPO_NAME" -F number="$ISSUE_NUM" \
              --jq '.data.repository.issue.id')

            if [ -z "$ISSUE_NODE_ID" ]; then
              echo "  Unable to get node ID for issue #${ISSUE_NUM}"
              continue
            fi

            COPILOT_ID=$(gh api graphql \
              -H "GraphQL-Features: issues_copilot_assignment_api_support,coding_agent_model_selection" \
              -f query='
              query($owner: String!, $repo: String!) {
                repository(owner: $owner, name: $repo) {
                  suggestedActors(first: 10, capabilities: [CAN_BE_ASSIGNED]) {
                    nodes {
                      login
                      ... on Bot { id }
                      ... on User { id }
                      ... on Mannequin { id }
                    }
                  }
                }
              }' -f owner="$OWNER" -f repo="$REPO_NAME" \
              --jq '.data.repository.suggestedActors.nodes[] | select(.login == "copilot-swe-agent") | .id')

            if [ -z "$COPILOT_ID" ]; then
              echo "  Copilot agent not available in ${REPO_FULL}"
              continue
            fi

            echo "  Copilot ID: ${COPILOT_ID}"

            gh api graphql \
              -H "GraphQL-Features: issues_copilot_assignment_api_support,coding_agent_model_selection" \
              -f query="mutation { addAssigneesToAssignable(input: { assignableId: \"$ISSUE_NODE_ID\", assigneeIds: [\"$COPILOT_ID\"] }) { clientMutationId } }" \
              && echo "  Copilot assigned" \
              || echo "  Error assigning Copilot"

          done < created-issues.txt

      - name: Prepare Teams message
        if: always()
        run: |
          ORG="${{ github.repository_owner }}"
          if [ "${{ env.no_failures }}" = "true" ]; then
            if [ "${{ env.mode }}" = "repo" ]; then
              echo "TEAMS_TITLE=Repository OK" >> "$GITHUB_ENV"
              echo "TEAMS_MESSAGE=No failed workflows in ${{ inputs.target-repo }}." >> "$GITHUB_ENV"
            else
              echo "TEAMS_TITLE=Org OK" >> "$GITHUB_ENV"
              echo "TEAMS_MESSAGE=No failed workflows in the last 2 hours." >> "$GITHUB_ENV"
            fi
            echo "TEAMS_COLOR=green" >> "$GITHUB_ENV"
          else
            if [ -f "new-failures.jsonl" ] && [ -s "new-failures.jsonl" ]; then
              FAILURE_COUNT=$(wc -l < new-failures.jsonl | tr -d ' ')
            else
              FAILURE_COUNT=1
            fi

            FAILURE_LIST=""
            if [ -f "new-failures.jsonl" ] && [ -s "new-failures.jsonl" ]; then
              while IFS= read -r f; do
                REPO=$(echo "$f" | jq -r '.repo' | sed "s|${ORG}/||")
                NAME=$(echo "$f" | jq -r '.name')
                ID=$(echo "$f" | jq -r '.id')
                URL=$(echo "$f" | jq -r '.url')
                FAILURE_LIST="${FAILURE_LIST}• ${REPO} - ${NAME} ([run #${ID}](${URL}))  \n"
              done < new-failures.jsonl
            fi

            if [ "${{ env.mode }}" = "repo" ]; then
              TITLE="Workflow failed - ${{ inputs.target-repo }}"
              MSG="Failed workflow detected in ${{ inputs.target-repo }}."
              ISSUE_LINK="https://github.com/${{ inputs.target-repo }}/issues"
              {
                echo "TEAMS_MESSAGE<<EOF"
                echo "${MSG}"
                echo ""
                printf '%b' "${FAILURE_LIST}"
                echo ""
                echo "Check issues: ${ISSUE_LINK}"
                echo "EOF"
              } >> "$GITHUB_ENV"
            else
              TITLE="Failed workflows detected - ${ORG}"
              MSG="Found ${FAILURE_COUNT} failures in the last 2 hours:"

              ISSUE_LINKS=""
              SEEN_REPOS=""
              if [ -f "new-failures.jsonl" ] && [ -s "new-failures.jsonl" ]; then
                while IFS= read -r f; do
                  REPO=$(echo "$f" | jq -r '.repo')
                  if ! echo "$SEEN_REPOS" | grep -q "$REPO"; then
                    ISSUE_LINKS="${ISSUE_LINKS}• https://github.com/${REPO}/issues\n"
                    SEEN_REPOS="${SEEN_REPOS} ${REPO}"
                  fi
                done < new-failures.jsonl
              fi

              {
                echo "TEAMS_MESSAGE<<EOF"
                echo "${MSG}"
                echo ""
                printf '%b' "${FAILURE_LIST}"
                echo ""
                echo "Check issues per repository:"
                printf '%b' "${ISSUE_LINKS}"
                echo "EOF"
              } >> "$GITHUB_ENV"
            fi

            echo "TEAMS_TITLE=${TITLE}" >> "$GITHUB_ENV"
            echo "TEAMS_COLOR=red" >> "$GITHUB_ENV"
          fi

      - name: Send Teams notification
        if: always()
        uses: org-test-reply-1/platform-actions/notify-teams@main
        with:
          webhook-url: ${{ secrets.TEAMS_WEBHOOK_URL }}
          title: ${{ env.TEAMS_TITLE }}
          message: ${{ env.TEAMS_MESSAGE }}
          color: ${{ env.TEAMS_COLOR }}
